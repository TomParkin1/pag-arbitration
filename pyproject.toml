[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pag-arbitration"
version = "1.0.0"
description = "Simulation study of PAG-inspired discrete mode switching versus continuous blending for a foraging agent under predator threat."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Thomas Parkin" }]
requires-python = ">=3.11"
# Pinned to the exact versions used to generate the dissertation results.
dependencies = [
    "gymnasium==1.2.3",
    "matplotlib==3.10.8",
    "numpy==2.3.5",
    "pandas==3.0.1",
    "pygame==2.6.1",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = [
    "mypy==2.4.1",
    "pandas-stubs==3.1.0.261029",
    "pytest==9.2.0",
    "ruff==0.17.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pag_arbitration"]
